name: job-finder

# Local development stack: source is bind-mounted, code hot-reloads, ports exposed.
# This is your inner loop — run `make up`. Production lives in docker-compose.prod.yml.

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    target: dev
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-development}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    POSTGRES_USER: ${POSTGRES_USER:-jobfinder}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobfinder}
    POSTGRES_DB: ${POSTGRES_DB:-jobfinder}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobfinder}
      POSTGRES_DB: ${POSTGRES_DB:-jobfinder}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=INFO

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
