[project]
name = "job-finder"
version = "0.1.0"
description = "Self-hostable job aggregator and CV-matching tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "black>=24.10",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "types-redis",
]

# This is an application, not a library — uv manages the environment but does not
# build/install the project itself. `app/` is importable from the working directory.
[tool.uv]
package = false

# --- Formatting: black owns this. Do NOT enable `ruff format`. ---
[tool.black]
line-length = 100
target-version = ["py312"]

# --- Linting: ruff as linter only (imports, bugbear, pyupgrade, comprehensions...). ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade,
# B = bugbear, C4 = comprehensions, SIM = simplify.

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates migrations; exempt them from import-order and line-length rules.
"alembic/versions/*.py" = ["I001", "E501"]

# --- Type checking: mypy, pragmatic to start. Tighten over time. ---
[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Deliberately not --strict yet. Flip these on per-package as the code settles:
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
