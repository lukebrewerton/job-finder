---
# GitLab CI — canonical CI for this project. GitHub is a mirror only; do not add GitHub Actions.

image: python:3.12-slim

variables:
  UV_LINK_MODE: "copy"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

stages:
  - lint
  - test

.uv-setup: &uv-setup
  before_script:
    - pip install uv --quiet
    - uv sync --frozen

lint:
  stage: lint
  <<: *uv-setup
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/uv
      - .venv
  script:
    - uv run ruff check .
    - uv run black --check .
    - uv run mypy app

test:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: jobfinder
    POSTGRES_PASSWORD: jobfinder
    POSTGRES_DB: jobfinder
    POSTGRES_HOST_AUTH_METHOD: trust
  <<: *uv-setup
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/uv
      - .venv
  script:
    - uv run alembic upgrade head
    - uv run pytest
